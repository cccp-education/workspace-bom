name: runAllTests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref — saves runner-minutes on rapid pushes.
concurrency:
  group: run-all-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # Bakery's CI shard tasks are `onlyIf { System.getenv("CI") != null }`
  # (Local = Build, Tests = CI). GitHub already exports CI=true; pinned explicitly
  # (like bakery-gradle/.github/workflows/test.yml) so a shard can never be
  # silently skipped and leave an empty kover binary report.
  CI: "true"

jobs:
  # ── coverage guard (anti "test fantôme", S-269 / S-298) ─────────────────────
  # Asserts the `borough-check` matrix below covers EXACTLY the testable surface
  # declared in workspace-bom/build.gradle.kts: one `check` entry per non-sharded
  # borough, and the exhaustive bakery shard set. Guarded by
  # `verifyCiMatrixCoverage`.
  matrix-coverage:
    name: CI matrix coverage guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout workspace-bom
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify the CI matrix covers every testable borough
        run: ./gradlew verifyCiMatrixCoverage --no-daemon

  # ── per-borough checks + per-shard bakery checks (parallel machines) ────────
  # Formerly one monolithic job (~19 min = the sum of each `check`). Each entry
  # now runs on its own runner, so the wall-clock is max(entry) instead of the
  # sum. Each build is standalone (pattern 0124): it resolves its dependencies
  # from Maven Central, never from a sibling worktree — an entry therefore clones
  # only its own borough.
  #
  # The 4 non-sharded boroughs keep `./gradlew check`. `bakery-gradle` is sharded
  # (S-298): its monolithic `check` (11m44s) is replaced by the 16 shard tasks
  # defined in bakery-gradle/bakery-plugin/build.gradle.kts (S-259) —
  #   • unit          : `test`
  #   • 8 BDD shards  : cucumberTestShard{JbakeCoreFoundations,JbakeCoreComponents,
  #                     JbakeCorePipelines,LensTree,SiteTree,LangSwitchCore,
  #                     LangSwitchEcosystem,I18nMassPipeline}
  #   • 6 func shards : functionalTestShard{A,B,C,D,E,F}
  #   • node host     : nodeTest
  # ASSUMED COUPLING (workspace-bom ↔ bakery): workspace-bom invokes these task
  # names by string. The list is mirrored once in build.gradle.kts
  # (`bakeryShardTasks`) and locked by `verifyCiMatrixCoverage` (matrix-coverage
  # job): a shard dropped here fails the guard (anti "test fantôme").
  # Each shard uploads its kover binary report (`build/kover/bin-reports/*.ic`);
  # the `bakery-coverage` job merges them and enforces the 85 % threshold.
  # The mapping is otherwise the exact `testableProjects` of build.gradle.kts.
  borough-check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Check · api-key-pool"
            kind: check
            borough: api-key-pool-gradle
            dir: .
            task: check
            node: false
          - name: "Check · dashboard"
            kind: check
            borough: dashboard-gradle
            dir: .
            task: check
            node: false
          - name: "Check · planner"
            kind: check
            borough: planner-gradle
            dir: .
            task: check
            node: false
          - name: "Check · slider"
            kind: check
            borough: slider-gradle
            dir: .
            task: check
            node: false
          # ── bakery shards (S-298) — replaces bakery's monolithic `check` ──
          - name: "Bakery · unit"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: test
            node: true
            coverage: true
          - name: "Bakery · functional-shard-A"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: functionalTestShardA
            node: true
            coverage: true
          - name: "Bakery · functional-shard-B"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: functionalTestShardB
            node: true
            coverage: true
          - name: "Bakery · functional-shard-C"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: functionalTestShardC
            node: true
            coverage: true
          - name: "Bakery · functional-shard-D"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: functionalTestShardD
            node: true
            coverage: true
          - name: "Bakery · functional-shard-E"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: functionalTestShardE
            node: true
            coverage: true
          - name: "Bakery · functional-shard-F"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: functionalTestShardF
            node: true
            coverage: true
          - name: "Bakery · bdd-shard-jbake-core-foundations"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: cucumberTestShardJbakeCoreFoundations
            node: true
            coverage: true
          - name: "Bakery · bdd-shard-jbake-core-components"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: cucumberTestShardJbakeCoreComponents
            node: true
            coverage: true
          - name: "Bakery · bdd-shard-jbake-core-pipelines"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: cucumberTestShardJbakeCorePipelines
            node: true
            coverage: true
          - name: "Bakery · bdd-shard-lens-tree"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: cucumberTestShardLensTree
            node: true
            coverage: true
          - name: "Bakery · bdd-shard-site-tree"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: cucumberTestShardSiteTree
            node: true
            coverage: true
          - name: "Bakery · bdd-shard-lang-switch-core"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: cucumberTestShardLangSwitchCore
            node: true
            coverage: true
          - name: "Bakery · bdd-shard-lang-switch-ecosystem"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: cucumberTestShardLangSwitchEcosystem
            node: true
            coverage: true
          - name: "Bakery · bdd-shard-i18n-mass-pipeline"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: cucumberTestShardI18nMassPipeline
            node: true
            coverage: true
          - name: "Bakery · node"
            kind: shard
            borough: bakery-gradle
            dir: bakery-plugin
            task: nodeTest
            node: true
            coverage: false

    steps:
      - name: Checkout ${{ matrix.borough }}
        uses: actions/checkout@v4
        with:
          repository: cccp-education/${{ matrix.borough }}
          path: foundry/public/${{ matrix.borough }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # bakery's shards include the Node.js host tests (`nodeTest`) — install
      # Node explicitly instead of relying on the runner's preinstalled runtime.
      - name: Set up Node.js
        if: ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Keep the local build cache warm across runs of the same matrix entry
          # (skips the post-job cleanup Gradle build, ~3-40 s/entry).
          cache-cleanup: never

      - name: Run ${{ matrix.borough }} ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --no-daemon
        working-directory: foundry/public/${{ matrix.borough }}/${{ matrix.dir }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.borough }}-${{ matrix.task }}
          # `dir` is "." for consumer roots, which upload-artifact rejects as a
          # relative path ("/./") — list both candidate locations instead.
          path: |
            foundry/public/${{ matrix.borough }}/build/reports/
            foundry/public/${{ matrix.borough }}/bakery-plugin/build/reports/
          if-no-files-found: ignore

      # Bakery shards only — one kover binary report per shard, merged by
      # `bakery-coverage`. `nodeTest` produces no coverage (`.ic`), hence
      # `coverage: false` on its entry.
      - name: Upload kover binary report
        if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-bakery-${{ matrix.task }}
          path: foundry/public/${{ matrix.borough }}/bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── bakery merged coverage (S-298) ───────────────────────────────────────────
  # Downloads every bakery shard's `.ic`, merges them into the same
  # `build/kover/bin-reports` and runs the report + threshold check WITHOUT
  # re-running any test (`-x` excludes every instrumented Test task; kover still
  # aggregates the binary reports already on disk). The 85 % threshold stays
  # blocking. This replaces the coverage the monolithic `check` used to enforce:
  # the merged set == test + functionalTest + cucumberTest, exactly what `check`
  # covered (`e2eTest` was never part of bakery's `check`).
  bakery-coverage:
    name: "Bakery · coverage (merged)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: borough-check

    defaults:
      run:
        working-directory: foundry/public/bakery-gradle/bakery-plugin

    steps:
      - name: Checkout bakery-gradle
        uses: actions/checkout@v4
        with:
          repository: cccp-education/bakery-gradle
          path: foundry/public/bakery-gradle
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Download every bakery coverage binary report
        uses: actions/download-artifact@v4
        with:
          pattern: kover-ic-bakery-*
          merge-multiple: true
          path: foundry/public/bakery-gradle/bakery-plugin/build/kover/bin-reports

      - name: List merged binary reports
        run: ls -la build/kover/bin-reports

      - name: Verify merged coverage threshold
        run: >
          ./gradlew koverXmlReport koverThresholdCheck --no-daemon
          -x test -x functionalTest -x cucumberTest -x nodeTest
          -x functionalTestShardA -x functionalTestShardB -x functionalTestShardC
          -x functionalTestShardD -x functionalTestShardE -x functionalTestShardF
          -x cucumberTestShardJbakeCoreFoundations -x cucumberTestShardJbakeCoreComponents
          -x cucumberTestShardJbakeCorePipelines
          -x cucumberTestShardLensTree -x cucumberTestShardSiteTree
          -x cucumberTestShardLangSwitchCore -x cucumberTestShardLangSwitchEcosystem
          -x cucumberTestShardI18nMassPipeline

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-merged-report
          path: foundry/public/bakery-gradle/bakery-plugin/build/reports/kover/
          if-no-files-found: warn
